
name: AI Trading Signal Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install requests

      - name: Trading-Signale pruefen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Signaldaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trading signals"
            git pull --rebase origin main
          git push origin HEAD:main
          fi
